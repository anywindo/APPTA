<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    :root {
      --text-tertiary: rgba(235, 235, 245, 0.40);
      --font-mac: -apple-system, sans-serif;
      --font-mono: monospace;
    }
    .drawer-body {
      height: 200px;
      background: #111;
      display: flex;
      flex-direction: column;
    }
    .console-text {
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.45;
      color: rgba(235, 235, 245, 0.85);
      white-space: pre-wrap;
      word-break: break-all;
      flex: 1;
      margin: 0;
    }
    .console-text:empty::before {
      content: "No process logs to display.";
      color: var(--text-tertiary);
      font-family: var(--font-mac);
      font-size: 12px;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="drawer-body">
    <pre class="console-text"></pre>
  </div>
</body>
</html>
